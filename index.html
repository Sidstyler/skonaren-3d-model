function gable(span,len,eave,ridge,wallM,over=0.45,roofM=mat.roof){

 g.add(new THREE.Mesh(geo,wallM));
 const rise=ridge-eave,a=Math.atan2(rise,h),L=Math.hypot(h,rise)+over;

}
